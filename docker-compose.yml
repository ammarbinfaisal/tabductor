# The whole application, from a cold checkout:
#
#   docker compose up -d                        # Postgres + migrations + engine + web
#   open http://localhost:3000
#
#   docker compose up -d postgres minio          # just the datastores — what the test suite needs
#   docker compose --profile telemetry up -d     # + Grafana LGTM, for OTLP export
#
# Chrome stays out on purpose: the testkit launches local Chrome per test on a throwaway
# profile, and that locally-launched browser IS the BYO-CDP simulator, connected to exactly
# the way production connects to a user's endpoint (docs/subphases/ROADMAP.md).
name: tabductor

# One image for all three app services. They are the same workspace under three commands;
# building it three times would let the engine and the web app drift between rebuilds.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: tabductor-app:local
  environment: &app-env
    DATABASE_URL: postgres://tabductor:tabductor@postgres:5432/tabductor
    BLOB_ENDPOINT: http://minio:9000
    BLOB_ACCESS_KEY: tabductor
    BLOB_SECRET_KEY: tabductor
    BLOB_BUCKET: tabductor-blobs
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Unset = telemetry is a no-op (techical_plan §17.2 rule 2). The telemetry profile
    # below sets it for the containers that should export.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Both app processes need a key, for different reasons. `web` compiles each event's
    # description into a packet schema at publish (docs/event-centric-model.md §3); `engine`
    # runs the `(browser|asset|decision, ai)` executors, which is why the old "the engine
    # never calls a model" carve-out stopped being true at S4b. Anthropic wins when both are
    # present. `SCHEMA_MODEL` overrides that provider's default model id, so a deployment can
    # pin one that outlives ours.
    #
    # Unset is a working mode for both, not a broken one: unchanged events carry their schema
    # forward by hash, so a publish that adds no new event still succeeds, and the engine
    # withholds the three AI executors and says so at boot. It is a publish needing a *new*
    # schema, or a run of an `ai`-mode task, that fails.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    SCHEMA_MODEL: ${SCHEMA_MODEL:-}
  depends_on:
    migrate:
      condition: service_completed_successfully
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    # 5434 because a dev box's 5432 belongs to whoever claimed it first. Loopback by default;
    # `BIND_ADDR=0.0.0.0` opts into LAN exposure. The credentials below are trivial by design,
    # so anything that can route here can read and write the database — opt in deliberately.
    ports: ["${BIND_ADDR:-127.0.0.1}:5434:5432"]
    environment:
      POSTGRES_USER: tabductor
      POSTGRES_PASSWORD: tabductor
      POSTGRES_DB: tabductor
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # -d is load-bearing: without it pg_isready probes a "tabductor" database that only
      # exists because POSTGRES_DB says so, and reports healthy a beat early on first boot.
      test: ["CMD-SHELL", "pg_isready -U tabductor -d tabductor"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Migrations are their own one-shot service, not something the app does on boot: engine
  # and web start together, and two processes racing the same migration is how a schema
  # ends up half-applied. Both wait for this to exit 0.
  migrate:
    <<: *app
    command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Execution: outbox dispatcher, run loop, cron scheduler, timeout watchdog, crash recovery.
  #
  # `node --import tsx` rather than `pnpm start`: SIGTERM has to reach the engine's own
  # handler so in-flight runs get their grace period, and every wrapper between PID 1 and
  # the process is somewhere that signal can be dropped. Verified — a compose stop logs
  # "shutting down" and exits 0, it does not die by signal.
  engine:
    <<: *app
    command: ["node", "--import", "tsx", "apps/engine/src/main.ts"]
    environment:
      <<: *app-env
      PYRUNNER_URL: http://pyrunner:4200
    # Restated in full, not extended: a YAML merge key replaces the mapping it merges into, so
    # inheriting `x-app`'s depends_on and adding pyrunner means writing all three out.
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      pyrunner:
        condition: service_healthy
    networks: [default, compute]
    # The secrets KEK (S5b) lives on a volume because `fileKeyWrapper` mints one on first use
    # if the file is absent. Left on the container's writable layer, every `--build` or
    # recreation would mint a *new* v1 KEK and orphan every already-wrapped `secrets` row —
    # permanently, and with no error until a `fill` fails. `SECRETS_KEK_FILE_PATH` defaults to
    # ./data/secrets-kek.json, which is what this mounts.
    volumes: ["kek:/app/data"]

  # Control plane: Next.js + tRPC. Reads and writes definitions and run rows; never executes.
  # `next start` binds 0.0.0.0 and holds nothing that needs flushing, so it keeps the plain
  # script entry point.
  web:
    <<: *app
    command: ["pnpm", "-F", "web", "start"]
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:3000"]
    init: true
    healthcheck:
      # node rather than curl/wget — neither is in the slim base image, and adding one just
      # to answer a health check is a package to keep patched for no reason.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Python compute (S5h): `mode=python` asset nodes run here. The engine POSTs a job, this
  # process writes it to a temp dir and runs `python` as a subprocess under a wall clock, then
  # hands back the files and emit lines for the engine to validate and store.
  #
  # An ordinary service, with no docker socket, because after the S5h reshape a job is a
  # subprocess of this process rather than a container it launches — this container *is* the
  # isolation unit. `compute` is internal and nothing is published: hygiene, not a boundary.
  # The wall clock in `apps/pyrunner/src/job.ts` is the only runtime control there is, and the
  # program it runs is the operator's own code, published through their own control plane.
  #
  # `init: true` matters more here than elsewhere: a wall-clock kill takes out a process group,
  # and PID 1 without an init leaks the zombies.
  pyrunner:
    build:
      context: .
      dockerfile: Dockerfile
      target: pyrunner
    image: tabductor-pyrunner:local
    command: ["node", "--import", "tsx", "apps/pyrunner/src/main.ts"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # 0.0.0.0 inside an unpublished container on an internal network: the engine has to reach
      # it across the compose network, and nothing outside that network can.
      PYRUNNER_HOST: 0.0.0.0
      PYRUNNER_PORT: "4200"
      PYRUNNER_WALL_CLOCK_MS: ${PYRUNNER_WALL_CLOCK_MS:-60000}
    # `compute` only — deliberately not on `default` too. It needs no database, no blob store
    # and no internet; the engine reaches it across `compute`, and being off `default` is what
    # makes the "no route anywhere" claim below actually true rather than aspirational.
    networks: [compute]
    init: true
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # The blob store: content-addressed screenshots today, response bodies and rendered assets
  # later (`packages/browser/src/blob-store.ts`). Speaking the S3 API rather than a bespoke
  # one means a real S3 or R2 bucket in production is an endpoint swap, not a rewrite.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    # 9002 for the same reason postgres is on 5434: a dev box's 9000 belongs to whoever
    # claimed it first. Loopback by default, `BIND_ADDR=0.0.0.0` to expose it — the creds
    # below are trivial, so anything that can route here can read and write the blobs.
    ports: ["${BIND_ADDR:-127.0.0.1}:9002:9000"]
    environment:
      MINIO_ROOT_USER: tabductor
      MINIO_ROOT_PASSWORD: tabductor # MinIO enforces an 8-char minimum; this clears it at 9.
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Grafana LGTM all-in-one — Loki (logs), Tempo (traces), Mimir (metrics), Grafana.
  # Opt-in: telemetry is no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set (techical_plan
  # §17.2 rule 2), so the suite and docker-less dev never need this running.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["telemetry"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3000" # Grafana UI — 3001 to leave 3000 to the web app
      - "${BIND_ADDR:-127.0.0.1}:4317:4317" # OTLP gRPC
      - "${BIND_ADDR:-127.0.0.1}:4318:4318" # OTLP HTTP
    volumes: ["lgtm:/data"]
    restart: unless-stopped

networks:
  default:
  # Internal: no gateway, so nothing on it can route off the host. pyrunner sits here and
  # nowhere else, so a job has no network to reach even though nothing stops it trying.
  # Hygiene, not the isolation boundary — the container is that, and the wall clock is the
  # only runtime control.
  compute:
    internal: true

volumes:
  pgdata:
  miniodata:
  lgtm:
  kek:

{{- if not .Values.pythonRunner.enabled }}
{{- fail "pythonRunner.enabled must be true: browser runs require the isolated Python runtime" }}
{{- end }}
{{- if .Values.pythonRunner.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tabductor.fullname" . }}-python-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tabductor.fullname" . }}-python-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tabductor.fullname" . }}-python-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "tabductor.fullname" . }}-python-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tabductor.fullname" . }}-python-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-python-runner
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: python-runner }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: python-runner }
    spec:
      {{- with .Values.pythonRunner.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      serviceAccountName: {{ include "tabductor.fullname" . }}-python-runner
      containers:
        - name: broker
          image: {{ .Values.pythonRunner.brokerImage | quote }}
          env:
            - { name: PYTHON_RUNNER_DRIVER, value: kubernetes }
            - { name: PYTHON_RUNNER_OWNER, value: {{ include "tabductor.fullname" . | quote }} }
            - { name: PYTHON_RUNNER_NODE_SELECTOR, value: {{ toJson .Values.pythonRunner.executionNodeSelector | quote }} }
            - { name: PYTHON_RUNNER_IMAGE, value: {{ .Values.pythonRunner.image | quote }} }
            - name: PYTHON_RUNNER_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "tabductor.configSecret" . }}, key: PYTHON_RUNNER_TOKEN }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ containerPort: 8092 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8092 } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabductor.fullname" . }}-python-runner
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: python-runner }
  ports: [{ port: 8092, targetPort: 8092 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tabductor.fullname" . }}-python-execution-isolation
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tabductor-python-execution }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}

apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tabductor.fullname" . }}-smoke"
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "tabductor.fullname" . }}-web:3000/status"]

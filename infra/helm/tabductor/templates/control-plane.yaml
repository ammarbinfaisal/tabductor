{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-web
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.webReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pnpm", "-F", "web", "start"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.fullname" . }}-config }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /status, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - { name: kek, mountPath: /app/data }
      volumes:
        - name: kek
          hostPath:
            path: {{ .Values.secrets.storagePath | quote }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabductor.fullname" . }}-web
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  type: {{ ternary "NodePort" "ClusterIP" (ne .Values.service.nodePort nil) }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-engine
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.engineReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: engine
    spec:
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--import", "tsx", "apps/engine/src/main.ts"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.fullname" . }}-config }
          env:
            - { name: SECRETS_KEK_FILE_PATH, value: /app/data/secrets-kek.json }
          resources: {{- toYaml .Values.resources.engine | nindent 12 }}
          volumeMounts:
            - { name: kek, mountPath: /app/data }
      volumes:
        - name: kek
          hostPath:
            path: {{ .Values.secrets.storagePath | quote }}
            type: DirectoryOrCreate
{{- end }}

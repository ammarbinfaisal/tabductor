{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-web
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.webReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "tabductor.fullname" . }}-app
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "tabductor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pnpm", "-F", "web", "start"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.configSecret" . }} }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /status, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - { name: kek, mountPath: /app/data }
      volumes:
        - name: kek
          {{- if .Values.secrets.kms }}
          emptyDir: {}
          {{- else }}
          hostPath:
            path: {{ .Values.secrets.storagePath | quote }}
            type: DirectoryOrCreate
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabductor.fullname" . }}-web
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  type: {{ ternary "NodePort" "ClusterIP" (and (not .Values.fleet.enabled) (ne .Values.service.nodePort nil)) }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if and (not .Values.fleet.enabled) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-engine
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.engineReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: engine
    spec:
      serviceAccountName: {{ include "tabductor.fullname" . }}-app
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: {{ include "tabductor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--import", "tsx", "apps/engine/src/main.ts"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.configSecret" . }} }
          env:
            - { name: SECRETS_KEK_FILE_PATH, value: /app/data/secrets-kek.json }
            {{- if .Values.pythonRunner.enabled }}
            - { name: BROWSER_AGENT_BACKEND, value: python }
            - { name: PYTHON_RUNNER_URL, value: "ws://{{ include "tabductor.fullname" . }}-python-runner:8092" }
            {{- end }}
          resources: {{- toYaml .Values.resources.engine | nindent 12 }}
          volumeMounts:
            - { name: kek, mountPath: /app/data }
      volumes:
        - name: kek
          {{- if .Values.secrets.kms }}
          emptyDir: {}
          {{- else }}
          hostPath:
            path: {{ .Values.secrets.storagePath | quote }}
            type: DirectoryOrCreate
          {{- end }}
{{- end }}
{{- if and .Values.controlPlane.enabled .Values.fleet.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "tabductor.fullname" . }}-app
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "tabductor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--import", "tsx", "apps/gateway/src/main.ts"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.configSecret" . }} }
          ports: [{ name: http, containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabductor.fullname" . }}-gateway
spec:
  type: {{ ternary "NodePort" "ClusterIP" (ne .Values.service.nodePort nil) }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  ports:
    - name: http
      port: 8081
      targetPort: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- end }}

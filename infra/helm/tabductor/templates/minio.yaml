{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabductor.fullname" . }}-minio
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabductor.fullname" . }}-minio
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER, value: {{ .Values.minio.accessKey | quote }} }
            - { name: MINIO_ROOT_PASSWORD, value: {{ .Values.minio.secretKey | quote }} }
          ports:
            - { name: api, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.minio.storagePath | quote }}
            type: DirectoryOrCreate
{{- end }}

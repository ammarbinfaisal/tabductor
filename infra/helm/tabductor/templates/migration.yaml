{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tabductor.fullname" . }}-migrate
  labels:
    {{- include "tabductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tabductor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "tabductor.fullname" . }}-app
      containers:
        - name: migrate
          image: {{ include "tabductor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
          envFrom:
            - secretRef: { name: {{ include "tabductor.configSecret" . }} }
{{- end }}

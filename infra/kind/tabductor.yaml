kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tabductor-staging
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 3000
        listenAddress: 127.0.0.1
        protocol: TCP
    extraMounts:
      - hostPath: __TABDUCTOR_STATE_DIR__
        containerPath: /var/local/tabductor-staging
  - role: worker
    extraMounts:
      - hostPath: __TABDUCTOR_STATE_DIR__
        containerPath: /var/local/tabductor-staging
  - role: worker
    extraMounts:
      - hostPath: __TABDUCTOR_STATE_DIR__
        containerPath: /var/local/tabductor-staging
